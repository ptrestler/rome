<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roma 2026</title>
  <style>
    :root {
      --bg: #F4F6FB;
      --card: #FFFFFF;
      --primary: #1C3057;
      --primary-dark: #142340;
      --accent: #C9973A;
      --green: #1E6B7A;
      --green-dark: #155A67;
      --text: #1C2B45;
      --text-muted: #6B7A94;
      --text-light: #9BAABB;
      --border: #D8DFED;
      --tag-bg: #EDF0F8;
      --shadow: rgba(28,48,87,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .header .subtitle {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .hotel-link {
      display: inline-block;
      margin-top: 9px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .hotel-link:active { background: rgba(255,255,255,0.3); }

    /* ── COUNTDOWN / STATUS BANNER ── */
    #banner {
      background: #FDF8EE;
      border-bottom: 1px solid #E8D9B8;
      padding: 9px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
      display: none;
    }

    /* ── STICKY NAV ── */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .nav-btn {
      background: var(--tag-bg);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      transition: all 0.15s;
      flex-shrink: 0;
      user-select: none;
    }
    .nav-btn:active { background: var(--primary); color: white; transform: scale(0.93); }
    .nav-btn:disabled { opacity: 0.25; pointer-events: none; }

    .nav-center {
      text-align: center;
      flex: 1;
      padding: 0 10px;
      min-width: 0;
    }
    .nav-day-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    .nav-day-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .nav-today-pill {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── DOTS ── */
    .dots-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 8px 16px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .dots-row::-webkit-scrollbar { display: none; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .dot.is-open { background: #A8BEDD; }
    .dot.active { transform: scale(1.4); }
    .dot.active:not(.is-open) { background: var(--primary); }
    .dot.active.is-open { background: var(--green); }
    .dot.is-today { box-shadow: 0 0 0 2px var(--accent); }

    /* ── MAIN CONTENT ── */
    .content {
      padding: 14px 14px 40px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── DAY CARD ── */
    .day-card {
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 3px 20px var(--shadow);
      display: none;
    }
    .day-card.active {
      display: block;
      animation: fadeUp 0.22s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Card header */
    .card-header {
      padding: 22px 20px 18px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
    }
    .card-header.is-open-header {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    }
    .card-header.is-departure {
      background: linear-gradient(135deg, #555 0%, #333 100%);
    }
    .card-header .day-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.75;
      margin-bottom: 5px;
    }
    .card-header h2 {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.25;
    }
    .card-header .card-sub {
      font-size: 13px;
      opacity: 0.82;
      margin-top: 5px;
      line-height: 1.4;
    }
    .today-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    /* Highlights */
    .highlights {
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      border-bottom: 1px solid var(--border);
      background: #F2F5FC;
    }
    .pill {
      background: var(--tag-bg);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #C8D4E8;
    }
    .pill.green-pill {
      background: #E8F0F8;
      color: var(--green);
      border-color: #B8CEDF;
    }

    /* Section wrapper */
    .section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child { border-bottom: none; }
    .sec-title {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-light);
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* ── TIMELINE ── */
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-item {
      display: flex;
      gap: 12px;
      position: relative;
    }
    .tl-left {
      width: 68px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding-top: 3px;
    }
    .tl-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-align: right;
      line-height: 1.2;
    }
    .tl-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 5px;
    }
    .tl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1.5px var(--primary);
      flex-shrink: 0;
    }
    .tl-line {
      width: 2px;
      background: var(--border);
      flex: 1;
      min-height: 14px;
      margin-top: 4px;
    }
    .tl-item:last-child .tl-line { display: none; }
    .tl-right {
      flex: 1;
      padding-bottom: 16px;
    }
    .tl-item:last-child .tl-right { padding-bottom: 0; }
    .tl-activity {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }
    .tl-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }
    .tl-map {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: var(--primary);
      text-decoration: none;
      margin-top: 5px;
      font-weight: 600;
      background: var(--tag-bg);
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid #C8D4E8;
    }
    .tl-map:active { opacity: 0.7; }

    /* ── FOOD ── */
    .food-list { display: flex; flex-direction: column; gap: 9px; }
    .food-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: var(--tag-bg);
      border-radius: 12px;
      border: 1px solid #C8D4E8;
      gap: 10px;
    }
    .food-info { flex: 1; min-width: 0; }
    .food-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .food-note { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .food-map {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 9px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .food-map:active { opacity: 0.8; }

    /* ── TRANSPORT ── */
    .transport-box {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      background: #E8F0F8;
      border-radius: 12px;
      padding: 13px 15px;
      border: 1px solid #B8CEDF;
    }
    .transport-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .transport-text { font-size: 13px; color: var(--green-dark); line-height: 1.5; font-weight: 500; }

    /* ── OPEN DAY SUGGESTIONS ── */
    .open-day-intro {
      background: #E8F0F8;
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 4px;
      border: 1px solid #B8CEDF;
    }
    .open-day-intro p {
      font-size: 13px;
      color: var(--green-dark);
      line-height: 1.5;
    }
    .sug-cat { margin-bottom: 20px; }
    .sug-cat:last-child { margin-bottom: 0; }
    .sug-cat-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--green);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #B8CEDF;
    }
    .sug-item {
      padding: 11px 13px;
      background: #EBF1FA;
      border-radius: 11px;
      margin-bottom: 8px;
      border-left: 3px solid #7AAAC8;
    }
    .sug-item:last-child { margin-bottom: 0; }
    .sug-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .sug-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }
    .sug-map {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--green);
      text-decoration: none;
      margin-top: 6px;
      font-weight: 600;
      background: #E0EAF8;
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid #B8CEDF;
    }
    .sug-map:active { opacity: 0.7; }

    /* ── FREE TIME ── */
    .freetime-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .freetime-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .freetime-item {
      display: flex;
      gap: 11px;
      padding: 11px 13px;
      background: #FDF8EE;
      border-radius: 11px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent);
    }
    .freetime-item:last-child { margin-bottom: 0; }
    .freetime-item-text { flex: 1; }
    .freetime-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .freetime-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }
    .freetime-map {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      margin-top: 6px;
      font-weight: 600;
      background: #FDF3DC;
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid #E8D090;
    }
    .freetime-map:active { opacity: 0.7; }

    /* ── DEPARTURE ALERT ── */
    .departure-alert {
      background: #FFF3CD;
      border: 1px solid #FFDDA0;
      border-radius: 12px;
      padding: 13px 15px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 0;
    }
    .departure-alert .alert-icon { font-size: 20px; flex-shrink: 0; }
    .departure-alert .alert-text { font-size: 13px; color: #7A5800; line-height: 1.5; font-weight: 500; }

    /* ── TRIP OVERVIEW card ── */
    .overview-section { padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .overview-item {
      background: var(--tag-bg);
      border-radius: 11px;
      padding: 11px 13px;
      border: 1px solid #C8D4E8;
    }
    .overview-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-light); font-weight: 700; margin-bottom: 4px; }
    .overview-value { font-size: 14px; font-weight: 700; color: var(--text); }
    .overview-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>

<div class="header">
  <h1>&#127981; Roma</h1>
  <div class="subtitle">Aug 31 – Sep 12, 2026 &nbsp;·&nbsp; 4 Adults &nbsp;·&nbsp; 13 Days</div>
  <a href="https://maps.google.com/?q=Via+Calandrelli+6A+00153+Roma+Italy" target="_blank" class="hotel-link">
    🏠 Via Calandrelli, 6A &nbsp;·&nbsp; Trastevere
  </a>
</div>

<div id="banner"></div>

<div class="sticky-nav">
  <div class="day-nav">
    <button class="nav-btn" id="prevBtn" onclick="goDay(currentDay - 1)">&#8592;</button>
    <div class="nav-center">
      <div class="nav-day-num" id="navDayNum"></div>
      <div class="nav-day-date" id="navDayDate"></div>
      <div id="navTodayPill"></div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="goDay(currentDay + 1)">&#8594;</button>
  </div>
  <div class="dots-row" id="dotsRow"></div>
</div>

<div class="content" id="cardsContainer"></div>

<script>
const mapsUrl = q => `https://maps.google.com/?q=${encodeURIComponent(q)}`;
const mapLink = (label, query, green) => query
  ? `<a href="${mapsUrl(query)}" target="_blank" class="${green ? 'sug-map' : 'tl-map'}">&#128205; ${label}</a>`
  : '';

const SUGGESTIONS = [
  { cat: 'Museums & Art', items: [
    { name: 'Galleria Doria Pamphilj', desc: 'Stunning private collection — Velázquez & Caravaggio in a palatial setting. Far less crowded than the big museums.', map: 'Galleria Doria Pamphilj Rome' },
    { name: 'Centrale Montemartini', desc: 'Ancient Roman sculptures displayed inside a converted power plant. One of Rome\'s most unique experiences.', map: 'Centrale Montemartini Rome' },
    { name: 'Baths of Caracalla', desc: 'Massive ancient thermal complex — incredibly atmospheric and surprisingly uncrowded.', map: 'Baths of Caracalla Rome' },
    { name: 'Galleria Spada', desc: 'Small, intimate gallery with Caravaggio and a famous trompe l\'oeil corridor that fools your eyes.', map: 'Galleria Spada Rome' },
    { name: 'Palazzo Massimo alle Terme', desc: 'Incredible Roman frescoes and mosaics (National Roman Museum). Underrated gem.', map: 'Palazzo Massimo alle Terme Rome' },
    { name: 'Keats-Shelley House', desc: 'For literary lovers — the house where Keats died, right next to the Spanish Steps.', map: 'Keats Shelley House Rome' },
  ]},
  { cat: 'Neighborhoods & Outdoors', items: [
    { name: 'EUR District', desc: 'Mussolini-era modernist architecture. The Palazzo della Civiltà Italiana — the "Square Colosseum" — is surreal.', map: 'Palazzo della Civiltà Italiana Rome EUR' },
    { name: 'Pigneto Neighborhood', desc: 'Creative, local, artsy. Great for aperitivo and dinner away from the tourist crowds.', map: 'Pigneto Rome' },
    { name: 'Gianicolo Hill', desc: 'The best panoramic view in Rome — especially magical at sunset. Cannon fires at noon daily.', map: 'Gianicolo Hill Rome' },
  ]},
  { cat: 'Experiences', items: [
    { name: 'Cooking Class', desc: 'Pasta, pizza, or tiramisù making. Great small-group experience — book in advance.', map: 'cooking class Rome' },
    { name: 'Food Market Morning', desc: 'Campo de\'Fiori any day, or Porta Portese flea market on Sundays only.', map: 'Campo de Fiori Rome' },
    { name: 'Shopping', desc: 'Artisan leather in Monti, ceramics in Trastevere, food souvenirs at Volpetti in Testaccio.', map: 'Volpetti Testaccio Rome' },
    { name: 'Rooftop Aperitivo', desc: 'Hotel de la Ville, Terrazza Borromini, or Il Sorpasso — all stunning at golden hour.', map: 'Terrazza Borromini Rome' },
  ]},
  { cat: 'More Ancient History', items: [
    { name: 'Baths of Caracalla', desc: 'Enormous and worth it — the scale is hard to believe. Opera performances held here in summer!', map: 'Baths of Caracalla Rome' },
    { name: 'Circus Maximus', desc: 'The ancient chariot racing track — massive and atmospheric. Imagine 250,000 spectators.', map: 'Circus Maximus Rome' },
    { name: 'Palazzo Massimo alle Terme', desc: 'National Roman Museum with stunning frescoes and mosaics pulled from Roman villas.', map: 'Palazzo Massimo alle Terme Rome' },
  ]},
];

function suggestionsHTML() {
  return SUGGESTIONS.map(cat => `
    <div class="sug-cat">
      <div class="sug-cat-title">${cat.cat}</div>
      ${cat.items.map(item => `
        <div class="sug-item">
          <div class="sug-name">${item.name}</div>
          <div class="sug-desc">${item.desc}</div>
          ${mapLink('Map', item.map, true)}
        </div>
      `).join('')}
    </div>
  `).join('');
}

function tl(time, activity, note, mapQuery) {
  return { time, activity, note: note || '', map: mapQuery || '' };
}
function food(name, note, mapQuery) {
  return { name, note: note || '', map: mapQuery || '' };
}

const DAYS = [
  {
    day: 1, date: '2026-08-31', label: 'Day 1 · Sunday, August 31',
    title: 'Arrival in Rome', sub: 'Touch down, settle in, and take that first stroll.',
    open: false,
    highlights: ['✈️ Arrival day', '🌙 Trastevere evening'],
    schedule: [
      tl('11:00 AM', 'Arrive at Fiumicino Airport', 'Flight lands — welcome to Rome!', 'Fiumicino Airport Rome'),
      tl('11:45 AM', 'Clear customs & collect bags', 'Allow 30–45 min for passport control and baggage claim.', ''),
      tl('12:15 PM', 'Leonardo Express → Roma Termini', '~32 min, €14/person. Buy at the station.', 'Roma Termini Station'),
      tl('1:00 PM', 'Taxi to Trastevere', '~25 min from Termini to the Airbnb. Easiest with luggage.', 'Via Calandrelli 6A Rome Trastevere'),
      tl('1:30 PM', 'Check in to Airbnb', 'Settle in, freshen up — long travel day!', ''),
      tl('3:00 PM', 'Rest & decompress', 'Nap, adjust to the time zone. No agenda.', ''),
      tl('5:30 PM', 'Evening stroll in Trastevere', 'You\'re already there — wander the cobblestone streets, take it all in.', 'Trastevere Rome'),
      tl('8:00 PM', 'Dinner', '', ''),
    ],
    food: [
      food('Tonnarello', 'Classic Roman trattoria', 'Tonnarello Trastevere Rome'),
      food('Enzo al 29', 'Beloved local spot, book ahead', 'Enzo al 29 Rome'),
    ],
    transport: '🚄 Leonardo Express: Fiumicino → Termini (~32 min)',
  },
  {
    day: 2, date: '2026-09-01', label: 'Day 2 · Monday, September 1',
    title: 'Colosseum, Forum & Palatine Hill', sub: 'History nerds, this is YOUR day.',
    open: false,
    highlights: ['🏛️ Guided tour', '⬇️ Underground access', '🏘️ Monti neighborhood'],
    schedule: [
      tl('8:00 AM', 'Breakfast', '', ''),
      tl('8:45 AM', 'Head to the Colosseum', 'Meet your guide or gather as a group.', 'Colosseum Rome'),
      tl('9:00 AM', 'Guided tour — Colosseum, Forum & Palatine', 'Archaeologist-led with underground access. 4–5 hours. Wear comfortable shoes!', 'Roman Forum Rome'),
      tl('1:00 PM', 'Lunch in Monti', 'Alle Carrette or another spot in the neighborhood.', 'Monti neighborhood Rome'),
      tl('2:30 PM', 'Explore Monti', 'Rome\'s hippest neighborhood — vintage shops, galleries, great cafés.', 'Monti Rome'),
    ],
    food: [
      food('Alle Carrette', 'Roman pizza in Monti', 'Alle Carrette Rome'),
    ],
    transport: '🚇 Metro or walking from the Airbnb',
    freeTime: {
      label: 'Afternoon is yours from ~3 PM',
      items: [
        { text: 'Circus Maximus', desc: 'A short walk from Monti — the ancient chariot track is free and surprisingly atmospheric.', map: 'Circus Maximus Rome' },
        { text: 'Aperitivo at Campo de\'Fiori', desc: 'Lively piazza, great for a late afternoon drink before dinner.', map: 'Campo de Fiori Rome' },
      ],
    },
  },
  {
    day: 3, date: '2026-09-02', label: 'Day 3 · Tuesday, September 2',

// ── RENDERING ──

function renderFoodItem(f) {
  return `
    <div class="food-item">
      <div class="food-info">
        <div class="food-name">${f.name}</div>
        ${f.note ? `<div class="food-note">${f.note}</div>` : ''}
      </div>
      ${f.map ? `<a href="${mapsUrl(f.map)}" target="_blank" class="food-map">📍 Map</a>` : ''}
    </div>
  `;
}

function renderTimeline(schedule) {
  return schedule.map(item => `
    <div class="tl-item">
      <div class="tl-left"><div class="tl-time">${item.time}</div></div>
      <div class="tl-mid"><div class="tl-dot"></div><div class="tl-line"></div></div>
      <div class="tl-right">
        <div class="tl-activity">${item.activity}</div>
        ${item.note ? `<div class="tl-note">${item.note}</div>` : ''}
        ${item.map ? mapLink('View on map', item.map, false) : ''}
      </div>
    </div>
  `).join('');
}

function renderDay(d) {
  const isOpen = d.open;
  const isDeparture = !!d.departure;

  let html = `
    <div class="day-card" id="card-${d.day - 1}">
      <div class="card-header ${isOpen ? 'is-open-header' : ''} ${isDeparture ? 'is-departure' : ''}">
        <div class="day-label">${d.label}</div>
        <h2>${d.title}</h2>
        ${d.sub ? `<div class="card-sub">${d.sub}</div>` : ''}
        <div id="todayBadge-${d.day - 1}"></div>
      </div>
  `;

  if (d.farewell) {
    html += `
      <div class="section">
        <div style="background:#FFF3CD;border:1px solid #FFDDA0;border-radius:12px;padding:13px 15px;display:flex;gap:10px;align-items:flex-start;">
          <span style="font-size:20px">🥂</span>
          <span style="font-size:13px;color:#7A5800;line-height:1.5;font-weight:500;">Tonight could be the perfect farewell dinner — book somewhere special!</span>
        </div>
      </div>
    `;
  }

  if (d.highlights && d.highlights.length) {
    html += `<div class="highlights">${d.highlights.map(h => `<span class="pill ${isOpen ? 'green-pill' : ''}">${h}</span>`).join('')}</div>`;
  }

  if (isDeparture) {
    html += `
      <div class="section">
        <div class="departure-alert">
          <span class="alert-icon">⚠️</span>
          <div class="alert-text">Pack the night before! This is an early morning — no time for last-minute scrambling.</div>
        </div>
      </div>
    `;
  }

  if (isOpen) {
    html += `
      <div class="section">
        <div class="sec-title">Suggested Activities</div>
        <div class="open-day-intro" style="margin-bottom:16px">
          <p>Nothing is planned — choose what appeals to you. Some ideas below:</p>
        </div>
        ${suggestionsHTML()}
      </div>
    `;
  } else {
    if (d.schedule && d.schedule.length) {
      html += `
        <div class="section">
          <div class="sec-title">Schedule</div>
          <div class="timeline">${renderTimeline(d.schedule)}</div>
        </div>
      `;
    }

    if (d.freeTime) {
      html += `
        <div class="freetime-section">
          <div class="freetime-label">🌤 ${d.freeTime.label}</div>
          ${d.freeTime.items.map(item => `
            <div class="freetime-item">
              <div class="freetime-item-text">
                <div class="freetime-name">${item.text}</div>
                <div class="freetime-desc">${item.desc}</div>
                ${item.map ? `<a href="${mapsUrl(item.map)}" target="_blank" class="freetime-map">📍 Map</a>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    if (d.food && d.food.length) {
      html += `
        <div class="section">
          <div class="sec-title">Food Recommendations</div>
          <div class="food-list">${d.food.map(renderFoodItem).join('')}</div>
        </div>
      `;
    }

    if (d.transport) {
      html += `
        <div class="section">
          <div class="sec-title">Getting Around</div>
          <div class="transport-box">
            <span class="transport-icon">🗺️</span>
            <div class="transport-text">${d.transport}</div>
          </div>
        </div>
      `;
    }
  }

  html += `</div>`;
  return html;
}

// ── INIT ──

let currentDay = 0;

function buildUI() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = DAYS.map(renderDay).join('');

  const dotsRow = document.getElementById('dotsRow');
  dotsRow.innerHTML = DAYS.map((d, i) => `
    <div class="dot ${d.open ? 'is-open' : ''}" id="dot-${i}" onclick="goDay(${i})"></div>
  `).join('');
}

function getTripDay() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 0; i < DAYS.length; i++) {
    const d = new Date(DAYS[i].date);
    if (today.getTime() === d.getTime()) return i;
  }
  const tripStart = new Date(DAYS[0].date);
  const tripEnd = new Date(DAYS[DAYS.length - 1].date);
  if (today < tripStart) return -1;  // before trip
  if (today > tripEnd) return -2;    // after trip
  return -3; // shouldn't happen
}

function goDay(idx) {
  if (idx < 0 || idx >= DAYS.length) return;
  document.getElementById(`card-${currentDay}`)?.classList.remove('active');
  document.getElementById(`dot-${currentDay}`)?.classList.remove('active');
  currentDay = idx;
  document.getElementById(`card-${currentDay}`)?.classList.add('active');
  document.getElementById(`dot-${currentDay}`)?.classList.add('active');

  // Scroll dot into view
  const dot = document.getElementById(`dot-${currentDay}`);
  dot?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });

  document.getElementById('prevBtn').disabled = currentDay === 0;
  document.getElementById('nextBtn').disabled = currentDay === DAYS.length - 1;

  const d = DAYS[currentDay];
  document.getElementById('navDayNum').textContent = `Day ${d.day} of ${DAYS.length}`;
  document.getElementById('navDayDate').textContent = d.title;

  // Scroll to top of content
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  buildUI();

  const tripDayIdx = getTripDay();
  const today = new Date();
  today.setHours(0,0,0,0);

  const banner = document.getElementById('banner');
  const tripStart = new Date(DAYS[0].date);
  const tripEnd = new Date(DAYS[DAYS.length - 1].date);

  if (tripDayIdx >= 0) {
    // During trip — mark today
    document.getElementById(`dot-${tripDayIdx}`)?.classList.add('is-today');
    document.getElementById(`todayBadge-${tripDayIdx}`).innerHTML = `<div class="today-badge">📍 Today</div>`;
    document.getElementById('navTodayPill').innerHTML = '';
    goDay(tripDayIdx);
    banner.style.display = 'none';
  } else if (tripDayIdx === -1) {
    // Before trip — countdown
    const daysUntil = Math.ceil((tripStart - today) / (1000 * 60 * 60 * 24));
    banner.style.display = 'block';
    banner.textContent = `✈️ ${daysUntil} day${daysUntil !== 1 ? 's' : ''} until Rome!`;
    goDay(0);
  } else {
    // After trip
    banner.style.display = 'block';
    banner.style.color = '#6B7A94';
    banner.textContent = '🏛️ Arrivederci, Roma — what a trip!';
    goDay(0);
  }
}

// ── SWIPE SUPPORT ──

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) goDay(currentDay + 1);
    else goDay(currentDay - 1);
  }
}, { passive: true });

init();
</script>
