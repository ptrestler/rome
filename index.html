<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  [hidden] { display: none !important; }

  body {
    background: #E7E4DE;
    color: #2B2621;
    font-family: 'Spectral', Georgia, 'Times New Roman', serif;
  }

  a { color: #B5502F; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  a:hover { color: #8F3D22; }

  button { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid #B5502F; outline-offset: 2px; }

  .sheet {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: #FBF7EF;
    box-shadow: 0 0 60px rgba(43,38,33,.12);
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */

  .head {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #FBF7EF;
    border-bottom: 1px solid #E3D8C4;
    padding: 18px 22px 12px;
  }

  .head-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1;
    color: #2B2621;
  }

  .daterange {
    font-variant: small-caps;
    letter-spacing: .1em;
    font-size: 11px;
    color: #B5502F;
  }

  .subhead {
    font-style: italic;
    font-size: 12px;
    color: #8A8073;
    margin-top: 2px;
  }

  .toggle {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    background: #F1E7D6;
    border-radius: 10px;
    padding: 4px;
  }

  .toggle button {
    flex: 1;
    border: none;
    cursor: pointer;
    background: transparent;
    color: #9C8F7C;
    font-variant: small-caps;
    letter-spacing: .05em;
    font-size: 12.5px;
    padding: 9px 2px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .toggle button[aria-selected="true"] {
    background: #FBF7EF;
    color: #B5502F;
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(43,38,33,.12);
  }

  /* ---------- panels ---------- */

  #view-day { flex: 1; display: flex; flex-direction: column; }
  .panel { flex: 1; padding: 20px 18px 32px; }

  /* ---------- day rail ---------- */

  .rail {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 22px;
    border-bottom: 1px solid #EAE0CE;
    scroll-behavior: smooth;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail { scrollbar-width: none; }

  .rail button {
    flex: 0 0 auto;
    min-width: 52px;
    min-height: 52px;
    cursor: pointer;
    border: 1px solid #E3D8C4;
    background: #FBF7EF;
    border-radius: 12px;
    padding: 8px 6px;
    text-align: center;
  }

  .rail button .rn {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1;
    color: #B5502F;
  }

  .rail button .ds {
    font-size: 9.5px;
    letter-spacing: .03em;
    margin-top: 3px;
    color: #9C8F7C;
  }

  .rail button[aria-current="true"] {
    border-color: #B5502F;
    background: #B5502F;
  }
  .rail button[aria-current="true"] .rn { color: #FBF7EF; }
  .rail button[aria-current="true"] .ds { color: #FBF7EF; opacity: .9; }

  .rail button .dot {
    display: block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #B5502F;
    margin: 3px auto 0;
  }
  .rail button[aria-current="true"] .dot { background: #FBF7EF; }

  /* ---------- day view ---------- */

  .day { flex: 1; padding: 22px 22px 12px; }

  .dateline {
    font-variant: small-caps;
    letter-spacing: .08em;
    font-size: 12px;
    color: #9C6A4A;
  }

  .day-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 2px solid #2B2621;
    padding-bottom: 8px;
    margin-top: 2px;
  }

  .day-title .rn {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 40px;
    font-weight: 600;
    color: #B5502F;
    line-height: 1;
  }

  .day-title h2 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 26px;
    font-weight: 600;
    color: #2B2621;
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
  }

  .row { padding: 14px 0; border-top: 1px solid #EAE0CE; }
  .row:first-of-type { border-top: none; }

  .row-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .row-time {
    font-variant: small-caps;
    letter-spacing: .06em;
    font-size: 12.5px;
    color: #B5502F;
  }

  .row-dur {
    font-size: 11.5px;
    color: #B08A5B;
    white-space: nowrap;
  }

  .row-act {
    font-size: 16.5px;
    color: #2B2621;
    line-height: 1.3;
    margin-top: 4px;
  }

  .row-note {
    font-style: italic;
    font-size: 13px;
    color: #8A8073;
    margin-top: 4px;
    line-height: 1.4;
  }

  .meet {
    margin-top: 5px;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .meet span {
    font-variant: small-caps;
    letter-spacing: .07em;
    color: #9C6A4A;
  }

  .arrive {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 8px;
    padding: 5px 10px;
    border: 1px solid #B5502F;
    background: #F6E9E2;
    border-radius: 8px;
    font-variant: small-caps;
    letter-spacing: .06em;
    font-size: 12px;
    color: #8F3D22;
  }
  .arrive b { font-weight: 600; font-variant: normal; letter-spacing: 0; }

  .conf {
    margin-top: 6px;
    font-size: 12px;
    color: #6E6A62;
  }
  .conf span {
    font-variant: small-caps;
    letter-spacing: .07em;
    color: #9C6A4A;
  }
  .conf b { font-weight: 600; color: #2B2621; }

  /* ---------- prev / next ---------- */

  .nav {
    position: sticky;
    bottom: 0;
    background: #FBF7EF;
    border-top: 1px solid #E3D8C4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }

  .nav button {
    min-width: 44px;
    min-height: 44px;
    cursor: pointer;
    border: 1px solid #E3D8C4;
    background: #FBF7EF;
    color: #B5502F;
    border-radius: 10px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    padding: 0 16px;
  }
  .nav button:disabled { opacity: .3; cursor: default; }

  .nav .count {
    font-variant: small-caps;
    letter-spacing: .08em;
    font-size: 12.5px;
    color: #8A8073;
  }

  /* ---------- at a glance ---------- */

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .grid button {
    cursor: pointer;
    text-align: left;
    border: 1px solid #E3D8C4;
    background: #FBF7EF;
    border-radius: 14px;
    padding: 14px;
  }

  .grid .g-top { display: flex; align-items: baseline; gap: 8px; }

  .grid .rn {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 22px;
    color: #B5502F;
    line-height: 1;
  }

  .grid .ds {
    font-variant: small-caps;
    letter-spacing: .05em;
    font-size: 10.5px;
    color: #9C6A4A;
  }

  .grid .gt {
    font-size: 13.5px;
    color: #2B2621;
    margin-top: 6px;
    line-height: 1.3;
  }

  /* ---------- tickets ---------- */

  .panel h3 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 24px;
    font-weight: 600;
    color: #2B2621;
    margin: 0 0 2px;
  }

  .panel .lede {
    font-style: italic;
    font-size: 13px;
    color: #8A8073;
    margin: 0 0 12px;
    line-height: 1.45;
  }

  .ticket {
    border-top: 1px solid #EAE0CE;
    padding: 12px 0;
  }

  .ticket .t-when {
    font-variant: small-caps;
    letter-spacing: .06em;
    font-size: 12px;
    color: #B5502F;
  }

  .ticket .t-early {
    color: #8F3D22;
    font-weight: 600;
  }

  .ticket .t-name {
    font-size: 15px;
    color: #2B2621;
    margin-top: 2px;
    line-height: 1.3;
  }

  .ticket .t-meet {
    font-size: 12.5px;
    margin-top: 4px;
    line-height: 1.4;
  }
  .ticket .t-meet span {
    font-variant: small-caps;
    letter-spacing: .07em;
    color: #9C6A4A;
  }

  .ticket .t-code {
    font-size: 12.5px;
    color: #6E6A62;
    margin-top: 4px;
  }
  .ticket .t-code span {
    font-variant: small-caps;
    letter-spacing: .07em;
    color: #9C6A4A;
  }
  .ticket .t-code b { font-weight: 600; color: #2B2621; }

  .signoff {
    text-align: center;
    font-variant: small-caps;
    letter-spacing: .12em;
    font-size: 11px;
    color: #B08A5B;
    margin-top: 26px;
  }

  .footnote {
    text-align: center;
    font-style: italic;
    font-size: 11.5px;
    color: #9C8F7C;
    margin-top: 14px;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .rail { scroll-behavior: auto; }
  }
</style>

<div class="sheet">

  <div class="head">
    <div class="head-top">
      <div class="wordmark">Roma</div>
      <div class="daterange">Aug 31 &ndash; Sep 12, 2026</div>
    </div>
    <div class="subhead">4 adults &middot; based in Trastevere</div>
    <div class="toggle" role="tablist" aria-label="View">
      <button id="tab-day" role="tab" aria-selected="true" aria-controls="view-day">Day by day</button>
      <button id="tab-over" role="tab" aria-selected="false" aria-controls="view-over">At a glance</button>
      <button id="tab-tix" role="tab" aria-selected="false" aria-controls="view-tix">Tickets</button>
    </div>
  </div>

  <div id="view-day" role="tabpanel" aria-labelledby="tab-day">
    <div class="rail" id="rail"></div>
    <div class="day" id="day"></div>
    <div class="nav">
      <button id="prev" aria-label="Previous day">&lsaquo;</button>
      <div class="count" id="count"></div>
      <button id="next" aria-label="Next day">&rsaquo;</button>
    </div>
  </div>

  <div id="view-over" role="tabpanel" aria-labelledby="tab-over" class="panel" hidden></div>

  <div id="view-tix" role="tabpanel" aria-labelledby="tab-tix" class="panel" hidden></div>

</div>

<script>
(function () {
  var ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII'];

  function r(time, act, dur, notes, extra) {
    extra = extra || {};
    return {
      time: time, act: act, dur: dur, notes: notes,
      meet: extra.meet, meetQ: extra.meetQ, arrive: extra.arrive,
      conf: extra.conf, confLabel: extra.confLabel
    };
  }

  var days = [
    { dow: 'Mon', ds: 'Aug 31', title: 'Arrival in Trastevere', rows: [
      r('11:00a', '✈️  Arrive FCO — transfer to the Trastevere apartment', '', 'Overnight flight from DTW'),
      r('Evening', 'Welcome dinner in Trastevere', '', "Keep it easy — you'll be jet-lagged")
    ]},
    { dow: 'Tue', ds: 'Sep 1', title: 'Trastevere & the Ghetto', rows: [
      r('10:30a', 'Trastevere & Jewish Ghetto walking tour', '2 hrs', '', { meet: 'Fontana delle Tartarughe', conf: 'QR code in email', confLabel: 'Ticket' }),
      r('Evening', 'Dinner in the Ghetto, or back in Trastevere', '', '')
    ]},
    { dow: 'Wed', ds: 'Sep 2', title: 'Ancient Rome', rows: [
      r('Morning', 'Monti neighborhood stroll', '~2 hrs', 'Breakfast, coffee, vintage shops'),
      r('12:15p', 'Colosseum / Roman Forum / Palatine Hill', '4–5 hrs', 'Guided, with underground access', { meet: 'Piazza del Colosseo', arrive: '11:45a', conf: 'GPCOPLX4JXQQNYZV', confLabel: 'Booking' }),
      r('Evening', 'San Clemente Basilica', '1 hr', 'Three layers of history underground — no booking needed')
    ]},
    { dow: 'Thu', ds: 'Sep 3', title: 'Vatican City', rows: [
      r('8:00a', "Vatican Museums, Sistine Chapel & St. Peter's", '4–5 hrs', '', { meet: 'Via Sebastiano Veniero 74', arrive: '7:30a', conf: 'FEMEDKNW', confLabel: 'Booking' }),
      r('Afternoon', "Castel Sant'Angelo", '1–1.5 hrs', 'Optional — only if you have energy. Can also move to Day 8.')
    ]},
    { dow: 'Fri', ds: 'Sep 4', title: 'Tivoli day trip', rows: [
      r('Full day', "Hadrian's Villa & Villa d'Este", '3–4 hrs + transit', 'Both can be booked on site')
    ]},
    { dow: 'Sat', ds: 'Sep 5', title: 'Borghese & La Pergola', rows: [
      r('9:00a', 'Borghese Gallery', '2 hrs', 'Timed entry — the gallery clears the rooms between slots', { meet: 'Piazzale Scipione Borghese 5', arrive: '8:30a', conf: '9203487', confLabel: 'Confirmation' }),
      r('Midday', 'Villa Borghese garden stroll', '', 'Walk straight out of the gallery into the park'),
      r('8:00p', 'La Pergola ★★★ Michelin', '~3 hrs', 'Confirmed — dress code applies', { meet: 'Via Alberto Cadlolo 101' })
    ]},
    { dow: 'Sun', ds: 'Sep 6', title: 'Baroque Rome', rows: [
      r('Morning', 'Trevi Fountain reserved access', '~30 min', 'Quiet before the crowds — buy at the site'),
      r('Morning', 'Piazza del Popolo & Santa Maria del Popolo', '~1 hr', 'Free Caravaggio paintings inside the church'),
      r('Midday ⭐', '⭐  Pantheon — Arch of Light phenomenon', '1 hr', 'LAST DAY this works (Sept 4–6) — arrive midday'),
      r('Afternoon', 'Piazza Navona stroll', '~30 min', 'Free'),
      r('Evening', 'Dinner in Centro Storico', '', '')
    ]},
    { dow: 'Mon', ds: 'Sep 7', title: 'Capitoline & the Tiber', rows: [
      r('Morning', 'Capitoline Museums', '2–3 hrs', "Use the Roma Pass — world's oldest public museum collection"),
      r('Afternoon', "Castel Sant'Angelo, if skipped on Day 4", '1–1.5 hrs', 'Optional — or just walk along the Tiber'),
      r('7:30p', 'Trattoria Vecchia dinner', '', '', { meet: 'Via Ferrùccio 12/b/c', meetQ: 'Via Ferruccio 12', conf: '6BiYKc', confLabel: 'Confirmation' })
    ]},
    { dow: 'Tue', ds: 'Sep 8', title: 'Free day', rows: [
      r('All day', 'FREE DAY — zero plans', '', 'Sleep in, wander, find a café, do nothing intentionally')
    ]},
    { dow: 'Wed', ds: 'Sep 9', title: 'The Appian Way', rows: [
      r('9:00a', 'Appian Way e-bike tour', '6 hrs', 'Wear something you can cycle in', { meet: 'Via Labicana 48', conf: 'GYGFWV236YMH', confLabel: 'Confirmation' }),
      r('Evening', 'Rest — big day tomorrow', '', '')
    ]},
    { dow: 'Thu', ds: 'Sep 10', title: 'Ostia Antica', rows: [
      r('Full day', 'Ostia Antica day trip', '3–4 hrs + transit', 'Can be booked on site')
    ]},
    { dow: 'Fri', ds: 'Sep 11', title: 'Cooking & farewell', rows: [
      r('11:00a', 'Testaccio cooking class — pasta, ravioli, tiramisù', '3 hrs', '', { meet: 'Via Galvani 4, Edificio C, citofono 11', meetQ: 'Via Galvani 4', conf: '1821314727', confLabel: 'Confirmation' }),
      r('Evening', 'Final dinner together', '', 'Make it a good one')
    ]},
    { dow: 'Sat', ds: 'Sep 12', title: 'Departure', rows: [
      r('Departure', '✈️  Transfer to FCO — depart Rome', '', '')
    ]}
  ];

  var tickets = [
    { when: 'Tue Sep 1 · 10:30a', name: 'Trastevere & Jewish Ghetto walking tour', meet: 'Fontana delle Tartarughe', label: 'Ticket', code: 'QR code in email' },
    { when: 'Wed Sep 2 · 12:15p', name: 'Colosseum, Forum & Palatine', meet: 'Piazza del Colosseo', label: 'Booking', code: 'GPCOPLX4JXQQNYZV', early: 'be there 11:45a' },
    { when: 'Thu Sep 3 · 8:00a', name: 'Vatican Museums & Sistine Chapel', meet: 'Via Sebastiano Veniero 74', label: 'Booking', code: 'FEMEDKNW', early: 'be there 7:30a' },
    { when: 'Sat Sep 5 · 9:00a', name: 'Borghese Gallery', meet: 'Piazzale Scipione Borghese 5', label: 'Confirmation', code: '9203487', early: 'be there 8:30a' },
    { when: 'Mon Sep 7 · 7:30p', name: 'Trattoria Vecchia dinner', meet: 'Via Ferrùccio 12/b/c', meetQ: 'Via Ferruccio 12', label: 'Confirmation', code: '6BiYKc' },
    { when: 'Wed Sep 9 · 9:00a', name: 'Appian Way e-bike tour', meet: 'Via Labicana 48', label: 'Confirmation', code: 'GYGFWV236YMH' },
    { when: 'Fri Sep 11 · 11:00a', name: 'Testaccio cooking class', meet: 'Via Galvani 4, Edificio C, citofono 11', meetQ: 'Via Galvani 4', label: 'Confirmation', code: '1821314727' }
  ];

  var sel = 0, view = 'day';

  try {
    var s = parseInt(localStorage.getItem('roma26_day'), 10);
    var v = localStorage.getItem('roma26_view');
    if (!isNaN(s) && s >= 0 && s <= 12) sel = s;
    if (v === 'overview' || v === 'day' || v === 'tickets') view = v;
  } catch (e) {}

  function save() {
    try {
      localStorage.setItem('roma26_day', String(sel));
      localStorage.setItem('roma26_view', view);
    } catch (e) {}
  }

  function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function mapLink(addr, query) {
    var url = 'https://www.google.com/maps/search/?api=1&query='
      + encodeURIComponent((query || addr) + ', Rome, Italy');
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">'
      + esc(addr) + '</a>';
  }

  var railEl = document.getElementById('rail');
  var dayEl = document.getElementById('day');
  var countEl = document.getElementById('count');
  var overEl = document.getElementById('view-over');
  var tixEl = document.getElementById('view-tix');
  var viewDay = document.getElementById('view-day');
  var tabs = {
    day: document.getElementById('tab-day'),
    overview: document.getElementById('tab-over'),
    tickets: document.getElementById('tab-tix')
  };
  var panels = { day: viewDay, overview: overEl, tickets: tixEl };

  function hasArrive(d) {
    for (var i = 0; i < d.rows.length; i++) if (d.rows[i].arrive) return true;
    return false;
  }

  function buildRail() {
    var html = '';
    for (var i = 0; i < days.length; i++) {
      html += '<button type="button" data-idx="' + i + '" aria-current="' + (i === sel) + '">'
        + '<div class="rn">' + ROMAN[i] + '</div>'
        + '<div class="ds">' + esc(days[i].ds) + '</div>'
        + (hasArrive(days[i]) ? '<span class="dot" aria-hidden="true"></span>' : '')
        + '</button>';
    }
    railEl.innerHTML = html;
  }

  function centerRail() {
    var el = railEl.querySelector('[data-idx="' + sel + '"]');
    if (!el || !railEl.clientWidth) return;
    var left = el.offsetLeft - railEl.clientWidth / 2 + el.offsetWidth / 2;
    railEl.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
  }

  function renderDay() {
    var d = days[sel];
    var html = '<div class="dateline">' + esc(d.dow) + ' &middot; ' + esc(d.ds) + '</div>'
      + '<div class="day-title"><div class="rn">' + ROMAN[sel] + '</div><h2>' + esc(d.title) + '</h2></div>';

    for (var i = 0; i < d.rows.length; i++) {
      var row = d.rows[i];
      html += '<div class="row"><div class="row-top"><div class="row-time">' + esc(row.time) + '</div>'
        + (row.dur ? '<div class="row-dur">' + esc(row.dur) + '</div>' : '')
        + '</div><div class="row-act">' + esc(row.act) + '</div>'
        + (row.notes ? '<div class="row-note">' + esc(row.notes) + '</div>' : '')
        + (row.meet ? '<div class="meet"><span>Meet at</span> ' + mapLink(row.meet, row.meetQ) + '</div>' : '')
        + (row.arrive ? '<div class="arrive">Arrive 30 min early &mdash; <b>be there ' + esc(row.arrive) + '</b></div>' : '')
        + (row.conf ? '<div class="conf"><span>' + esc(row.confLabel) + '</span> &nbsp;<b>' + esc(row.conf) + '</b></div>' : '')
        + '</div>';
    }
    dayEl.innerHTML = html;
    countEl.textContent = 'Day ' + (sel + 1) + ' of 13';
    document.getElementById('prev').disabled = (sel === 0);
    document.getElementById('next').disabled = (sel === days.length - 1);
  }

  function renderOverview() {
    var html = '';
    html += '<div class="grid">';
    for (var i = 0; i < days.length; i++) {
      html += '<button type="button" data-go="' + i + '">'
        + '<div class="g-top"><span class="rn">' + ROMAN[i] + '</span><span class="ds">' + esc(days[i].ds) + '</span></div>'
        + '<div class="gt">' + esc(days[i].title) + '</div></button>';
    }
    html += '</div>';

    html += '<div class="signoff">Buon viaggio · Roma 2026</div>';
    overEl.innerHTML = html;
  }

  function renderTickets() {
    var html = '<h3>Tickets &amp; meeting points</h3>'
      + '<p class="lede">Everything with a fixed time. Tap an address to open it in Maps — the confirmation is all you need at the door.</p>';

    for (var j = 0; j < tickets.length; j++) {
      var t = tickets[j];
      html += '<div class="ticket"><div class="t-when">' + esc(t.when)
        + (t.early ? ' &middot; <span class="t-early">' + esc(t.early) + '</span>' : '') + '</div>'
        + '<div class="t-name">' + esc(t.name) + '</div>'
        + (t.meet ? '<div class="t-meet"><span>Meet at</span> ' + mapLink(t.meet, t.meetQ) + '</div>' : '')
        + '<div class="t-code"><span>' + esc(t.label) + '</span> &nbsp;<b>' + esc(t.code) + '</b></div>'
        + '</div>';
    }

    html += '<div class="footnote">Roma Pass (72 hrs) covers the Capitoline Museums and the Borghese reservation — carry it on those days.</div>';
    tixEl.innerHTML = html;
  }

  function setView(v) {
    view = v;
    save();
    for (var k in panels) {
      if (!Object.prototype.hasOwnProperty.call(panels, k)) continue;
      tabs[k].setAttribute('aria-selected', String(k === v));
      panels[k].hidden = (k !== v);
    }
    if (v === 'day') centerRail();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function select(i, switchView) {
    sel = Math.max(0, Math.min(days.length - 1, i));
    save();
    buildRail();
    renderDay();
    if (switchView) setView('day'); else centerRail();
  }

  railEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-idx]');
    if (b) select(parseInt(b.getAttribute('data-idx'), 10), false);
  });

  overEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-go]');
    if (b) select(parseInt(b.getAttribute('data-go'), 10), true);
  });

  document.getElementById('prev').addEventListener('click', function () { select(sel - 1, false); });
  document.getElementById('next').addEventListener('click', function () { select(sel + 1, false); });
  tabs.day.addEventListener('click', function () { setView('day'); });
  tabs.overview.addEventListener('click', function () { setView('overview'); });
  tabs.tickets.addEventListener('click', function () { setView('tickets'); });

  buildRail();
  renderDay();
  renderOverview();
  renderTickets();
  setView(view);
})();
</script>
</body>
</html>
